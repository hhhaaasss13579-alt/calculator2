<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10172b">
  <meta name="description" content="آلة حاسبة علمية عربية تعمل دون اتصال بعد تثبيتها.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>حاسبتي العلمية</title>
  <style>
    :root {
      --bg: #070b18;
      --bg-2: #18223d;
      --panel: rgba(15, 23, 42, .75);
      --screen: rgba(15, 23, 42, .72);
      --key: rgba(255, 255, 255, .08);
      --key-active: rgba(255, 255, 255, .18);
      --operator: #7c3aed;
      --operator-active: #6d28d9;
      --danger: #ef476f;
      --equal: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
      --stroke: rgba(255, 255, 255, .15);
      --yellow: #facc15;
      --purple: #c4b5fd;
    }

    body.light {
      --bg: #edf2ff;
      --bg-2: #dbeafe;
      --panel: rgba(255, 255, 255, .74);
      --screen: rgba(255, 255, 255, .7);
      --key: rgba(255, 255, 255, .82);
      --key-active: rgba(255, 255, 255, .98);
      --text: #172033;
      --muted: #64748b;
      --stroke: rgba(255, 255, 255, .9);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }

    body {
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 14px;
      background:
        radial-gradient(circle at 8% 8%, rgba(124, 58, 237, .38), transparent 32%),
        radial-gradient(circle at 92% 92%, rgba(6, 182, 212, .28), transparent 30%),
        linear-gradient(145deg, var(--bg-2), var(--bg));
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      transition: background .3s, color .3s;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      z-index: -1;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      filter: blur(8px);
      opacity: .3;
      pointer-events: none;
    }
    body::before { top: -70px; right: -55px; background: #a855f7; }
    body::after { bottom: -70px; left: -55px; background: #22d3ee; }

    .app {
      width: min(100%, 470px);
      padding: 18px;
      border: 1px solid var(--stroke);
      border-radius: 32px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 5px; }

    .theme-toggle {
      width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--stroke);
      border-radius: 14px;
      background: var(--key);
      color: var(--text);
      font-size: 20px;
      box-shadow: none;
    }

    .screen {
      width: 100%;
      min-height: 128px;
      margin-bottom: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 7px;
      overflow: hidden;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      background: var(--screen);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      direction: ltr;
      text-align: right;
    }

    .screen-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 18px;
      color: var(--muted);
      font-size: 11px;
      direction: rtl;
    }

    #angleMode, #memoryBadge {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(124, 58, 237, .18);
      color: #c4b5fd;
      font-weight: bold;
    }

    #memoryBadge:empty { display: none; }

    #history {
      min-height: 18px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #display {
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: clamp(32px, 9vw, 52px);
      font-weight: 700;
      text-align: right;
      direction: ltr;
    }

    #hint {
      min-height: 15px;
      color: var(--muted);
      font-size: 10px;
      text-align: right;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 2px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .panel-title span:last-child { color: var(--purple); }

    .scientific-toggle {
      width: 100%;
      min-height: 52px;
      margin: 12px 0 8px;
      border: 1px solid rgba(196, 181, 253, .28);
      background: linear-gradient(145deg, rgba(124, 58, 237, .82), rgba(79, 70, 229, .82));
      color: white;
      font-size: 15px;
    }

    .scientific-toggle.open { background: linear-gradient(145deg, #0e7490, #0891b2); }

    .scientific-panel {
      display: none;
      animation: panelIn .2s ease-out;
    }

    .scientific-panel.open { display: block; }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 9px;
      direction: ltr;
      flex-wrap: wrap;
    }

    button {
      min-height: 54px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      color: var(--text);
      background: var(--key);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 14px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.06);
      transition: transform .12s, background .15s, box-shadow .15s;
    }

    button:hover { box-shadow: 0 8px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.1); }
    button:active { transform: translateY(2px) scale(.95); background: var(--key-active); }
    button:focus-visible { outline: 3px solid rgba(34, 211, 238, .55); outline-offset: 2px; }

    .control {
      min-width: 67px;
      min-height: 48px;
      padding: 0 9px;
      font-size: 12px;
      letter-spacing: .3px;
    }

    .control.yellow { background: linear-gradient(145deg, #fde047, #eab308); color: #241b00; }
    .control.purple { background: linear-gradient(145deg, #a78bfa, #6d28d9); color: white; }
    .control.active { outline: 2px solid #22d3ee; outline-offset: 2px; }

    .nav-pad {
      width: 91px;
      height: 62px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--stroke);
      border-radius: 15px;
      background: rgba(0,0,0,.16);
    }

    .nav-pad button {
      min-height: 17px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      box-shadow: none;
      font-size: 11px;
    }
    .nav-pad button:active { background: var(--key-active); }
    .nav-up { grid-column: 2; grid-row: 1; }
    .nav-left { grid-column: 1; grid-row: 2; }
    .nav-ok { grid-column: 2; grid-row: 2; color: #22d3ee; }
    .nav-right { grid-column: 3; grid-row: 2; }
    .nav-down { grid-column: 2; grid-row: 3; }

    .science-grid, .basic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      direction: ltr;
    }

    .sci-key {
      min-height: 57px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 17px;
    }

    .sci-key strong { font-size: 16px; line-height: 1; }
    .sci-key small { min-height: 12px; color: var(--yellow); font-size: 10px; line-height: 1; }
    .sci-key small.purple-label { color: var(--purple); }
    .sci-key.operator { background: linear-gradient(145deg, #8b5cf6, var(--operator)); }
    .sci-key.accent { background: linear-gradient(145deg, #155e75, #0e7490); }
    .sci-key.memory { background: linear-gradient(145deg, #334155, #1e293b); }

    .basic-grid { margin-top: 8px; }
    .basic-grid button { min-height: 64px; font-size: 23px; }
    .basic-grid .operator { background: linear-gradient(145deg, #8b5cf6, var(--operator)); }
    .basic-grid .danger { background: linear-gradient(145deg, #fb7185, var(--danger)); }
    .basic-grid .equal { background: linear-gradient(145deg, #22d3ee, var(--equal)); }
    .basic-grid .wide { grid-column: span 2; }

    .footer {
      margin-top: 13px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 380px) {
      .app { padding: 13px; border-radius: 25px; }
      .control { min-width: 57px; padding: 0 5px; font-size: 10px; }
      .nav-pad { width: 78px; }
      .science-grid, .basic-grid { gap: 6px; }
      .sci-key { min-height: 53px; }
      .basic-grid button { min-height: 55px; }
    }

    @media (max-height: 700px) {
      body { padding-top: 8px; padding-bottom: 8px; }
      .screen { min-height: 96px; padding: 11px 15px; }
      .sci-key, .basic-grid button { min-height: 48px; }
      .control { min-height: 42px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>حاسبتي العلمية</h1>
        <div class="subtitle">آلة حاسبة حديثة للموبايل</div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل المظهر">☀️</button>
    </header>

    <section class="screen" aria-label="شاشة النتيجة">
      <div class="screen-meta">
        <span id="angleMode">DEG</span>
        <span id="memoryBadge"></span>
      </div>
      <div id="history"></div>
      <input id="display" value="0" readonly aria-label="الناتج">
      <div id="hint">جاهز للحساب</div>
    </section>

    <div class="panel-title"><span>العمليات الأساسية</span><span>ابدأ من هنا</span></div>

    <section class="basic-grid" aria-label="الأزرار الأساسية">
      <button class="danger" data-action="clear">AC</button>
      <button data-action="backspace">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="÷">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="×">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="−">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="wide" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equal" data-action="calculate">=</button>
    </section>

    <button class="scientific-toggle" id="scientificToggle" type="button" aria-expanded="false">＋ فتح الأزرار العلمية</button>
    <section class="scientific-panel" id="scientificPanel" aria-label="الأزرار العلمية">

    <div class="panel-title"><span>SCIENTIFIC</span><span>SHIFT / ALPHA</span></div>

    <section class="control-row" aria-label="أزرار التحكم العلمية">
      <button class="control yellow" id="shiftBtn" type="button">SHIFT</button>
      <button class="control purple" id="alphaBtn" type="button">ALPHA</button>
      <div class="nav-pad" aria-label="أزرار التنقل">
        <button class="nav-up" data-nav="up">▲</button>
        <button class="nav-left" data-nav="left">◀</button>
        <button class="nav-ok" data-nav="ok">●</button>
        <button class="nav-right" data-nav="right">▶</button>
        <button class="nav-down" data-nav="down">▼</button>
      </div>
      <button class="control" id="modeBtn" type="button">MODE</button>
      <button class="control" id="secondBtn" type="button">2nd</button>
    </section>

    <section class="science-grid" aria-label="الأزرار العلمية">
      <button class="sci-key" data-action="calculate"><small>SOLVE =</small><strong>CALC</strong></button>
      <button class="sci-key" data-action="integral"><small>∫ dx</small><strong>∫</strong></button>
      <button class="sci-key" data-action="factorial" data-alt-action="gamma"><small>x!</small><strong>FACT</strong></button>
      <button class="sci-key" data-action="inverse" data-alt-action="percent"><small>x⁻¹</small><strong>1/x</strong></button>

      <button class="sci-key" data-action="fraction"><small>xʸ/z</small><strong>x/y</strong></button>
      <button class="sci-key" data-action="sqrt" data-alt-action="cbrt"><small>³√x</small><strong>√x</strong></button>
      <button class="sci-key" data-action="square" data-alt-action="cube"><small>x³</small><strong>x²</strong></button>
      <button class="sci-key operator" data-action="power"><small>▔</small><strong>xʸ</strong></button>

      <button class="sci-key" data-action="log" data-alt-action="power10"><small>10ˣ</small><strong>Log</strong></button>
      <button class="sci-key" data-action="ln" data-alt-action="powerE"><small>eˣ</small><strong>Ln</strong></button>
      <button class="sci-key" data-action="logBase"><small>Σ</small><strong>logₓy</strong></button>
      <button class="sci-key" data-action="sum" data-alt-action="product"><small>Π</small><strong>Σ</strong></button>

      <button class="sci-key" data-action="negate"><small>−</small><strong>(−)</strong></button>
      <button class="sci-key" data-action="dms"><small>° ' "</small><strong>DMS</strong></button>
      <button class="sci-key" id="hypBtn" data-action="hyp"><small>hyp</small><strong>HYP</strong></button>
      <button class="sci-key" data-action="sin" data-alt-action="asin"><small>sin⁻¹</small><strong>sin</strong></button>

      <button class="sci-key" data-action="cos" data-alt-action="acos"><small>cos⁻¹</small><strong>cos</strong></button>
      <button class="sci-key" data-action="tan" data-alt-action="atan"><small>tan⁻¹</small><strong>tan</strong></button>
      <button class="sci-key" data-action="sinh" data-alt-action="asinh"><small>asinh</small><strong>sinh</strong></button>
      <button class="sci-key" data-action="cosh" data-alt-action="acosh"><small>acosh</small><strong>cosh</strong></button>

      <button class="sci-key" data-action="tanh" data-alt-action="atanh"><small>atanh</small><strong>tanh</strong></button>
      <button class="sci-key" data-action="cot" data-alt-action="acot"><small>cot⁻¹</small><strong>cot</strong></button>
      <button class="sci-key" data-action="sec" data-alt-action="asec"><small>sec⁻¹</small><strong>sec</strong></button>
      <button class="sci-key" data-action="csc" data-alt-action="acsc"><small>csc⁻¹</small><strong>csc</strong></button>

      <button class="sci-key memory" data-action="memoryRecall"><small>STO / CLR</small><strong>RCL</strong></button>
      <button class="sci-key memory" data-action="eng"><small>i</small><strong>ENG</strong></button>

      <button class="sci-key" data-value="("><small>CONST</small><strong>(</strong></button>
      <button class="sci-key" data-value=")"><small>CONV</small><strong>)</strong></button>
      <button class="sci-key" data-action="decimalFraction"><small>↔</small><strong>S⇔D</strong></button>
      <button class="sci-key memory" data-action="memoryPlus" data-alt-action="memoryMinus"><small>M−</small><strong>M+</strong></button>
    </section>

    </section>
    </section>

    <div class="footer">تعمل بدون إنترنت بعد فتح الملف · ابدأ من لوحة الأرقام أو افتح الأزرار العلمية عند الحاجة</div>
  </main>

  <script>
    const display = document.getElementById('display');
    const history = document.getElementById('history');
    const hint = document.getElementById('hint');
    const angleModeLabel = document.getElementById('angleMode');
    const memoryBadge = document.getElementById('memoryBadge');
    const themeToggle = document.getElementById('themeToggle');
    const shiftBtn = document.getElementById('shiftBtn');
    const secondBtn = document.getElementById('secondBtn');
    const alphaBtn = document.getElementById('alphaBtn');
    const modeBtn = document.getElementById('modeBtn');
    const hypBtn = document.getElementById('hypBtn');
    const scientificToggle = document.getElementById('scientificToggle');
    const scientificPanel = document.getElementById('scientificPanel');

    let expression = '';
    let justCalculated = false;
    let alternateMode = false;
    let alphaMode = false;
    let hyperbolicMode = false;
    let angleMode = 'DEG';
    let memory = 0;

    scientificToggle.addEventListener('click', () => {
      const isOpen = scientificPanel.classList.toggle('open');
      scientificToggle.classList.toggle('open', isOpen);
      scientificToggle.setAttribute('aria-expanded', String(isOpen));
      scientificToggle.textContent = isOpen ? '− إخفاء الأزرار العلمية' : '＋ فتح الأزرار العلمية';
    });

    function storageGet(key) {
      try { return window.localStorage.getItem(key); } catch { return null; }
    }

    function storageSet(key, value) {
      try { window.localStorage.setItem(key, value); } catch { /* التخزين اختياري */ }
    }

    if (storageGet('calculator-theme') === 'light') {
      document.body.classList.add('light');
    }

    function updateThemeIcon() {
      const isLight = document.body.classList.contains('light');
      themeToggle.textContent = isLight ? '🌙' : '☀️';
      themeToggle.setAttribute('aria-label', isLight ? 'تفعيل الوضع الليلي' : 'تفعيل الوضع الفاتح');
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      storageSet('calculator-theme', document.body.classList.contains('light') ? 'light' : 'dark');
      updateThemeIcon();
    });

    function setHint(message) {
      hint.textContent = message;
    }

    function render() {
      display.value = expression || '0';
      angleModeLabel.textContent = angleMode;
      memoryBadge.textContent = memory !== 0 ? 'M' : '';
      shiftBtn.classList.toggle('active', alternateMode);
      secondBtn.classList.toggle('active', alternateMode);
      alphaBtn.classList.toggle('active', alphaMode);
      hypBtn.classList.toggle('active', hyperbolicMode);
      modeBtn.textContent = angleMode;
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) throw new Error();
      if (Math.abs(value) < 1e-10) value = 0;
      return String(Number(value.toFixed(10)));
    }

    function evaluate(source = expression) {
      if (!source) throw new Error();
      const allowed = /^[0-9+\-*/%.()^πe×÷− ]+$/;
      if (!allowed.test(source)) throw new Error();

      const safe = source
        .split('×').join('*')
        .split('÷').join('/')
        .split('−').join('-')
        .split('^').join('**')
        .split('π').join('Math.PI')
        .replace(/\be\b/g, 'Math.E');

      const result = Function('"use strict"; return (' + safe + ')')();
      if (!Number.isFinite(result)) throw new Error();
      return result;
    }

    function add(value) {
      if (justCalculated && /[0-9.πe(]/.test(value)) expression = '';
      justCalculated = false;

      if (value === '.') {
        const currentNumber = expression.split(/[+−×÷%^()]/).pop();
        if (currentNumber.includes('.')) return;
        if (!currentNumber) expression += '0';
      }

      const last = expression.slice(-1);
      const isOperator = /[+−×÷%^]/.test(value);
      const lastIsOperator = /[+−×÷%^]/.test(last);

      if (isOperator && lastIsOperator) expression = expression.slice(0, -1) + value;
      else expression += value;
      render();
    }

    function clearAll() {
      expression = '';
      history.textContent = '';
      justCalculated = false;
      setHint('جاهز للحساب');
      render();
    }

    function backspace() {
      expression = expression.slice(0, -1);
      justCalculated = false;
      render();
    }

    function calculate() {
      if (!expression) return;
      try {
        const original = expression;
        expression = formatNumber(evaluate());
        history.textContent = original + ' =';
        justCalculated = true;
        setHint('تم الحساب');
        render();
      } catch {
        history.textContent = 'العملية غير صحيحة';
        expression = '';
        setHint('تأكد من صيغة العملية');
        render();
      }
    }

    function currentValue() {
      return evaluate();
    }

    function toRadians(value) {
      if (angleMode === 'DEG') return value * Math.PI / 180;
      if (angleMode === 'GRAD') return value * Math.PI / 200;
      return value;
    }

    function fromRadians(value) {
      if (angleMode === 'DEG') return value * 180 / Math.PI;
      if (angleMode === 'GRAD') return value * 200 / Math.PI;
      return value;
    }

    function factorial(value) {
      if (value < 0 || !Number.isInteger(value) || value > 170) throw new Error();
      let result = 1;
      for (let i = 2; i <= value; i++) result *= i;
      return result;
    }

    function replaceWithResult(label, result) {
      if (!Number.isFinite(result)) throw new Error();
      history.textContent = label + '(' + expression + ') =';
      expression = formatNumber(result);
      justCalculated = true;
      setHint('تم تطبيق الدالة');
      render();
    }

    function applyUnary(action) {
      const value = currentValue();
      let result;
      let label = action;

      switch (action) {
        case 'factorial': result = factorial(value); label = 'FACT'; break;
        case 'gamma': result = factorial(value - 1); label = 'Γ'; break;
        case 'inverse': if (value === 0) throw new Error(); result = 1 / value; label = '1/'; break;
        case 'percent': result = value / 100; label = '%'; break;
        case 'sqrt': result = Math.sqrt(value); label = '√'; break;
        case 'cbrt': result = Math.cbrt(value); label = '³√'; break;
        case 'square': result = value ** 2; label = 'x²'; break;
        case 'cube': result = value ** 3; label = 'x³'; break;
        case 'power10': result = 10 ** value; label = '10ˣ'; break;
        case 'powerE': result = Math.exp(value); label = 'eˣ'; break;
        case 'log': if (value <= 0) throw new Error(); result = Math.log10(value); label = 'Log'; break;
        case 'ln': if (value <= 0) throw new Error(); result = Math.log(value); label = 'Ln'; break;
        case 'sin': result = hyperbolicMode ? Math.sinh(value) : Math.sin(toRadians(value)); label = hyperbolicMode ? 'sinh' : 'sin'; break;
        case 'cos': result = hyperbolicMode ? Math.cosh(value) : Math.cos(toRadians(value)); label = hyperbolicMode ? 'cosh' : 'cos'; break;
        case 'tan': result = hyperbolicMode ? Math.tanh(value) : Math.tan(toRadians(value)); label = hyperbolicMode ? 'tanh' : 'tan'; break;
        case 'sinh': result = Math.sinh(value); label = 'sinh'; break;
        case 'cosh': result = Math.cosh(value); label = 'cosh'; break;
        case 'tanh': result = Math.tanh(value); label = 'tanh'; break;
        case 'cot': {
          const sine = Math.sin(toRadians(value));
          if (Math.abs(sine) < 1e-12) throw new Error();
          result = 1 / Math.tan(toRadians(value)); label = 'cot'; break;
        }
        case 'sec': {
          const cosine = Math.cos(toRadians(value));
          if (Math.abs(cosine) < 1e-12) throw new Error();
          result = 1 / cosine; label = 'sec'; break;
        }
        case 'csc': {
          const sine = Math.sin(toRadians(value));
          if (Math.abs(sine) < 1e-12) throw new Error();
          result = 1 / sine; label = 'csc'; break;
        }
        case 'asin': result = fromRadians(Math.asin(value)); label = 'sin⁻¹'; break;
        case 'acos': result = fromRadians(Math.acos(value)); label = 'cos⁻¹'; break;
        case 'atan': result = fromRadians(Math.atan(value)); label = 'tan⁻¹'; break;
        case 'asinh': result = Math.asinh(value); label = 'sinh⁻¹'; break;
        case 'acosh': if (value < 1) throw new Error(); result = Math.acosh(value); label = 'cosh⁻¹'; break;
        case 'atanh': if (Math.abs(value) >= 1) throw new Error(); result = Math.atanh(value); label = 'tanh⁻¹'; break;
        case 'acot': result = fromRadians(Math.atan2(1, value)); label = 'cot⁻¹'; break;
        case 'asec': if (Math.abs(value) < 1) throw new Error(); result = fromRadians(Math.acos(1 / value)); label = 'sec⁻¹'; break;
        case 'acsc': if (Math.abs(value) < 1) throw new Error(); result = fromRadians(Math.asin(1 / value)); label = 'csc⁻¹'; break;
        case 'negate': result = -value; label = '±'; break;
        default: throw new Error();
      }
      replaceWithResult(label, result);
    }

    function logBase() {
      const base = Number(window.prompt('اكتب أساس اللوغاريتم:', '10'));
      if (!Number.isFinite(base) || base <= 0 || base === 1) return;
      const value = currentValue();
      if (value <= 0) throw new Error();
      replaceWithResult('log' + base, Math.log(value) / Math.log(base));
    }

    function listOperation(product = false) {
      const answer = window.prompt(product ? 'اكتب الأرقام مفصولة بفواصل لحساب حاصل الضرب:' : 'اكتب الأرقام مفصولة بفواصل لحساب المجموع:', expression || '1,2,3');
      if (!answer) return;
      const values = answer.split(',').map(Number);
      if (!values.length || values.some(value => !Number.isFinite(value))) throw new Error();
      const result = product ? values.reduce((a, b) => a * b, 1) : values.reduce((a, b) => a + b, 0);
      replaceWithResult(product ? 'Π' : 'Σ', result);
    }

    function convertDms() {
      const answer = window.prompt('اكتب الدرجات والدقائق والثواني بهذا الشكل: 30,15,20', '30,15,20');
      if (!answer) return;
      const parts = answer.split(/[,; ]+/).map(Number);
      if (parts.length !== 3 || parts.some(value => !Number.isFinite(value))) throw new Error();
      replaceWithResult('DMS', parts[0] + parts[1] / 60 + parts[2] / 3600);
    }

    function toFraction() {
      const value = currentValue();
      let bestNumerator = Math.round(value);
      let bestDenominator = 1;
      let bestError = Math.abs(value - bestNumerator);
      for (let denominator = 1; denominator <= 1000; denominator++) {
        const numerator = Math.round(value * denominator);
        const error = Math.abs(value - numerator / denominator);
        if (error < bestError) {
          bestError = error;
          bestNumerator = numerator;
          bestDenominator = denominator;
        }
      }
      history.textContent = 'تحويل عشري إلى كسر';
      expression = bestDenominator === 1 ? String(bestNumerator) : bestNumerator + '/' + bestDenominator;
      justCalculated = true;
      setHint('كسر تقريبي');
      render();
    }

    function engineering() {
      const value = currentValue();
      if (value === 0) return;
      const exponent = Math.floor(Math.log10(Math.abs(value)) / 3) * 3;
      const coefficient = value / (10 ** exponent);
      history.textContent = 'ENG';
      expression = formatNumber(coefficient) + '×10^' + exponent;
      justCalculated = true;
      setHint('صيغة هندسية');
      render();
    }

    function memoryAction(action) {
      if (action === 'memoryRecall') {
        expression = formatNumber(memory);
        justCalculated = true;
        setHint('تم استدعاء الذاكرة');
      } else {
        const value = currentValue();
        memory += action === 'memoryMinus' ? -value : value;
        setHint(action === 'memoryMinus' ? 'تم طرح القيمة من الذاكرة' : 'تمت إضافة القيمة للذاكرة');
      }
      render();
    }

    function runAction(action) {
      try {
        switch (action) {
          case 'calculate': calculate(); break;
          case 'clear': clearAll(); break;
          case 'backspace': backspace(); break;
          case 'factorial': case 'gamma': case 'inverse': case 'percent':
          case 'sqrt': case 'cbrt': case 'square': case 'cube':
          case 'power10': case 'powerE': case 'log': case 'ln':
          case 'sin': case 'cos': case 'tan': case 'asin': case 'acos': case 'atan':
          case 'sinh': case 'cosh': case 'tanh': case 'asinh': case 'acosh': case 'atanh':
          case 'cot': case 'sec': case 'csc': case 'acot': case 'asec': case 'acsc':
          case 'negate': applyUnary(action); break;
          case 'power': add('^'); break;
          case 'fraction': add('÷'); break;
          case 'logBase': logBase(); break;
          case 'sum': listOperation(false); break;
          case 'product': listOperation(true); break;
          case 'dms': convertDms(); break;
          case 'decimalFraction': toFraction(); break;
          case 'eng': engineering(); break;
          case 'memoryRecall': case 'memoryPlus': case 'memoryMinus': memoryAction(action); break;
          case 'integral': setHint('التكامل الرمزي غير متاح؛ استخدم قيمة عددية'); break;
          case 'hyp': hyperbolicMode = !hyperbolicMode; setHint(hyperbolicMode ? 'تم تفعيل HYP' : 'تم إيقاف HYP'); render(); break;
        }
      } catch {
        setHint(expression ? 'راجع الرقم أو العملية' : 'اكتب رقمًا أولًا من لوحة الأرقام');
        render();
      }
    }

    shiftBtn.addEventListener('click', () => {
      alternateMode = !alternateMode;
      setHint(alternateMode ? 'SHIFT مفعّل: الوظائف الثانوية' : 'SHIFT متوقف');
      render();
    });

    secondBtn.addEventListener('click', () => {
      alternateMode = !alternateMode;
      setHint(alternateMode ? '2nd مفعّل: الوظائف الثانوية' : '2nd متوقف');
      render();
    });

    alphaBtn.addEventListener('click', () => {
      alphaMode = !alphaMode;
      setHint(alphaMode ? 'ALPHA مفعّل' : 'ALPHA متوقف');
      render();
    });

    modeBtn.addEventListener('click', () => {
      angleMode = angleMode === 'DEG' ? 'RAD' : angleMode === 'RAD' ? 'GRAD' : 'DEG';
      setHint('وحدة الزوايا: ' + angleMode);
      render();
    });

    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => {
        const value = button.dataset.value;
        const nav = button.dataset.nav;
        if (nav) {
          setHint('تنقل: ' + nav);
          return;
        }
        if (value) add(value);

        let action = button.dataset.action;
        if (alternateMode && button.dataset.altAction) action = button.dataset.altAction;
        if (action) runAction(action);
      });
    });

    document.addEventListener('keydown', event => {
      const keyMap = { '*': '×', '/': '÷', '-': '−' };
      if (/^[0-9.]$/.test(event.key) || '+%()πe'.includes(event.key)) add(keyMap[event.key] || event.key);
      else if (keyMap[event.key]) add(keyMap[event.key]);
      else if (event.key === '^') add('^');
      else if (event.key === 'Enter' || event.key === '=') calculate();
      else if (event.key === 'Backspace') backspace();
      else if (event.key === 'Escape') clearAll();
    });

    updateThemeIcon();
    render();
  </script>
<script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
